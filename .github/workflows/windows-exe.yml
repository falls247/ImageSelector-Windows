name: Build Windows EXE

on:
  push:
    paths:
      - 'ImageSelector/**'
      - 'tests/**'
      - '.github/workflows/windows-exe.yml'
  pull_request:
    paths:
      - 'ImageSelector/**'
      - 'tests/**'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check compilation (WPF / Windows)
        shell: pwsh
        run: dotnet build .\ImageSelector\ImageSelector.csproj -c Release
      - name: Check bounded decoding policy
        shell: pwsh
        run: dotnet run --project .\tests\DecodePolicyChecks.csproj -c Release
      - name: Publish self-contained EXE
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        shell: pwsh
        run: >-
          dotnet publish .\ImageSelector\ImageSelector.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\publish
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        with:
          name: ImageSelector-win-x64
          path: publish/ImageSelector.exe
          if-no-files-found: error

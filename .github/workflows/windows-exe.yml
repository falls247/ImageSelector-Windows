name: Build Windows EXE

on:
  push:
    paths:
      - 'ImageSelector/**'
      - 'tests/**'
      - '.github/workflows/windows-exe.yml'
  pull_request:
    paths:
      - 'ImageSelector/**'
      - 'tests/**'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check compilation (WPF / Windows)
        shell: pwsh
        run: dotnet build .\ImageSelector\ImageSelector.csproj -c Release
      - name: Check bounded decoding policy
        shell: pwsh
        run: dotnet run --project .\tests\DecodePolicyChecks.csproj -c Release
      - name: Run real WIC image decode regression checks
        shell: pwsh
        run: dotnet run --project .\tests\DecodeIntegrationChecks.csproj -c Release
      - name: Check cross-process single-instance ownership
        shell: pwsh
        run: |
          dotnet build .\tests\InstanceProcessProbe.csproj -c Release
          $exe = (Resolve-Path .\tests\bin\Release\net10.0-windows\InstanceProcessProbe.exe).Path
          $owner = Start-Process -FilePath $exe -ArgumentList '--hold' -PassThru
          try {
            Start-Sleep -Milliseconds 800
            if ($owner.HasExited) { throw 'Owner exited unexpectedly' }
            $duplicate = Start-Process -FilePath $exe -Wait -PassThru
            if ($duplicate.ExitCode -ne 7) { throw "Expected duplicate exit 7, got $($duplicate.ExitCode)" }
            if (-not $owner.WaitForExit(8000)) { throw 'Owner did not exit' }
            $restarted = Start-Process -FilePath $exe -Wait -PassThru
            if ($restarted.ExitCode -ne 0) { throw 'Ownership not recovered after prior process exit' }
          } finally {
            if (-not $owner.HasExited) { $owner.Kill(); $owner.WaitForExit(5000) | Out-Null }
          }
      - name: Publish self-contained EXE
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        shell: pwsh
        run: >-
          dotnet publish .\ImageSelector\ImageSelector.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\publish
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        with:
          name: ImageSelector-win-x64
          path: publish/ImageSelector.exe
          if-no-files-found: error
